name: Materialize release build output
description: Validate a downloaded build artifact bundle and write a release-platform build-output manifest.

inputs:
  release-unit:
    description: Release-platform unit ID for every primary artifact in this bundle.
    required: true
  release-package:
    description: JSON package fields shared by the bundle (ecosystem and name required; version may be inferred from a Conda or wheel filename).
    required: true
  release-artifacts:
    description: JSON array of artifact/evidence descriptors relative to output-directory. Each primary path glob must resolve to exactly one file; omitted SBOM/provenance sidecars are generated as artifact-identity envelopes.
    required: true
  output-directory:
    description: Downloaded GitHub Actions artifact directory that contains the primary files and evidence.
    required: true
  manifest-name:
    description: Filename to write inside output-directory.
    required: false
    default: release-build-output.json
  metadata-name:
    description: Filename for the reserved build-environment metadata envelope inside output-directory.
    required: false
    default: release-build-metadata.json
  source-artifact-name:
    description: Name of the GitHub Actions artifact bundle that supplied this output.
    required: true
  source-sha:
    description: Source revision built by the producing job. Defaults to the current GitHub workflow SHA.
    required: false

outputs:
  manifest-path:
    description: Absolute path to the generated manifest.
    value: ${{ steps.materialize.outputs.manifest-path }}
  metadata-path:
    description: Absolute path to the reserved build-environment metadata envelope.
    value: ${{ steps.materialize.outputs.metadata-path }}

runs:
  using: composite
  steps:
    - id: materialize
      name: Materialize release build-output manifest
      shell: bash
      env:
        RELEASE_ARTIFACTS: ${{ inputs.release-artifacts }}
        RELEASE_MANIFEST_NAME: ${{ inputs.manifest-name }}
        RELEASE_METADATA_NAME: ${{ inputs.metadata-name }}
        RELEASE_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        RELEASE_PACKAGE: ${{ inputs.release-package }}
        RELEASE_SOURCE_ARTIFACT_NAME: ${{ inputs.source-artifact-name }}
        RELEASE_SOURCE_SHA: ${{ inputs.source-sha || github.sha }}
        RELEASE_UNIT: ${{ inputs.release-unit }}
      run: ${{ github.action_path }}/materialize.sh
