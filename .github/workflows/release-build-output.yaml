name: Materialize release build output

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the existing GitHub Actions artifact bundle to manifest.
        required: true
        type: string
      release-unit:
        description: Release-platform unit ID for every primary artifact in this bundle.
        required: true
        type: string
      release-package:
        description: JSON package fields shared by the bundle (ecosystem and name required; version may be inferred from a Conda or wheel filename).
        required: true
        type: string
      release-artifacts:
        description: JSON array of artifact/evidence descriptors relative to the downloaded artifact bundle. Missing SBOM/provenance sidecars are generated as artifact-identity envelopes.
        required: true
        type: string
      manifest-name:
        description: Filename to write in the bundle and upload as the companion manifest artifact.
        required: false
        default: release-build-output.json
        type: string
      metadata-name:
        description: Filename for the reserved build-environment metadata envelope.
        required: false
        default: release-build-metadata.json
        type: string
      source-sha:
        description: Source revision built by the producing job. Defaults to the caller workflow SHA.
        required: false
        type: string

    outputs:
      manifest-artifact-name:
        description: GitHub Actions artifact containing the generated manifest.
        value: ${{ jobs.manifest.outputs.manifest-artifact-name }}

permissions:
  actions: read
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    outputs:
      manifest-artifact-name: ${{ steps.manifest-artifact.outputs.name }}
    steps:
      - name: Download build artifact bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: release-build-output
      - name: Check out this workflow's manifest action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: release-build-output-action
          persist-credentials: false
          sparse-checkout: .github/actions/release-build-output
          sparse-checkout-cone-mode: false
      - name: Materialize manifest
        uses: ./release-build-output-action/.github/actions/release-build-output
        with:
          output-directory: release-build-output
          manifest-name: ${{ inputs.manifest-name }}
          metadata-name: ${{ inputs.metadata-name }}
          release-artifacts: ${{ inputs.release-artifacts }}
          release-package: ${{ inputs.release-package }}
          source-artifact-name: ${{ inputs.artifact-name }}
          source-sha: ${{ inputs.source-sha || github.sha }}
          release-unit: ${{ inputs.release-unit }}
      - id: manifest-artifact
        name: Set companion artifact name
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: echo "name=release-build-output-${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
      - name: Upload release build-output records
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest-artifact.outputs.name }}
          path: |
            release-build-output/${{ inputs.manifest-name }}
            release-build-output/${{ inputs.metadata-name }}
            release-build-output/release-evidence/**
          if-no-files-found: error
